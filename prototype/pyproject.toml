[project]
name = "toolcall-eval"
version = "0.1.0"
description = "Controlled prototype for evaluating backend LLM tool-calling strategies."
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23.0",
]

[dependency-groups]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "types-jsonschema>=4.23.0",
]

[project.scripts]
toolcall-eval = "toolcall_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolcall_eval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
